# Built-in system database of Coverly ROMs.
#
# One [[system]] per platform:
#   id          canonical id (stable; used by profiles and overrides)
#   name        display name
#   aliases     folder names, compared case-insensitively
#   extensions  ROM extensions, lowercase, without the dot
#   libretro    playlist folder name exactly as on https://thumbnails.libretro.com/
#               (live server root listing, not the GitHub umbrella repo names)
#   arcade      ROM set short names instead of game titles
#   multi_file  disc system: cue/bin, m3u, gdi, chd
#   header      header rule for content hashing: plain (default), nes, fds,
#               snes-copier, lynx or a7800; the digest without the header is
#               also computed so headerless DAT entries match
#   dats        libretro-database files (paths relative to the repo root) used
#               to identify ROMs by hash or arcade short name; replaces the
#               derived default (metadat/no-intro/<libretro>.dat, or
#               metadat/redump/<libretro>.dat for disc systems)
#   screenscraper  ScreenScraper system id (systemesListe.php); absent = the
#               system is not available on ScreenScraper
#   family      console (default), handheld, computer, arcade or engine;
#               groups systems in pickers (arcade = true defaults to arcade)
#   weak_extensions  extensions accepted inside the system's folder or with
#               its header or hash, never evidence by themselves (they do not
#               count for the extension class)
#   scoped_aliases  aliases (a subset of aliases) that resolve only under a
#               profile that names them, never as a global folder name
#
# Users can extend or override entries by id with a file in the same format.

