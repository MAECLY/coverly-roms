[package]
name = "coverly-core"
description = "Core library of Coverly ROMs: ROM library scanning, art audit and layout profiles."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true

[dependencies]
serde.workspace = true
toml.workspace = true
thiserror.workspace = true
walkdir.workspace = true
unicode-normalization.workspace = true
crc32fast.workspace = true
md-5.workspace = true
sha1.workspace = true
zip.workspace = true
rusqlite.workspace = true
directories.workspace = true
serde_json.workspace = true
ureq.workspace = true
percent-encoding.workspace = true
image.workspace = true
quick-xml.workspace = true
semver.workspace = true
base64.workspace = true
minisign-verify.workspace = true
minisign = { workspace = true, optional = true }

[features]
# Mock HTTP server, fixtures and throwaway update keys for tests of this
# crate and of the CLI.
test-util = ["dep:minisign"]

[dev-dependencies]
coverly-core = { path = ".", features = ["test-util"] }
filetime.workspace = true
flate2.workspace = true
insta.workspace = true
tempfile.workspace = true
