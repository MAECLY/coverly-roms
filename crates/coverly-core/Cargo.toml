[package]
name = "coverly-core"
description = "Core library of Coverly ROMs: ROM library scanning, art audit and layout profiles."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true

[dependencies]
serde.workspace = true
toml.workspace = true
thiserror.workspace = true
walkdir.workspace = true
unicode-normalization.workspace = true
crc32fast.workspace = true
md-5.workspace = true
sha1.workspace = true
# Never add lzma/xz/ppmd/zstd here: those zip methods are decoded by
# `archive` from the raw entry with capped decoders (spec S2, S3).
zip = { workspace = true, features = ["deflate-flate2", "deflate64", "bzip2"] }
flate2 = { workspace = true, features = ["zlib-rs"] }
sevenz-rust2 = { workspace = true, features = ["bzip2", "deflate", "ppmd"] }
lzma-rust2.workspace = true
ppmd-rust.workspace = true
ruzstd.workspace = true
lz4_flex.workspace = true
tar.workspace = true
bzip2.workspace = true
rusqlite.workspace = true
directories.workspace = true
serde_json.workspace = true
ureq.workspace = true
percent-encoding.workspace = true
encoding_rs.workspace = true
image.workspace = true
quick-xml.workspace = true
semver.workspace = true
base64.workspace = true
minisign-verify.workspace = true
minisign = { workspace = true, optional = true }
# The OS credential store (feature `keychain`): the app and the CLI.
keyring = { workspace = true, optional = true }

[target.'cfg(unix)'.dependencies]
libc.workspace = true

[target.'cfg(target_os = "macos")'.dependencies]
objc2-foundation.workspace = true
security-framework = { version = "3.7", optional = true }

[target.'cfg(windows)'.dependencies]
windows-sys = { workspace = true, features = [
  "Win32_Foundation",
  "Win32_Security",
  "Win32_Security_Authorization",
  "Win32_Storage_FileSystem",
  "Win32_System_Com",
  "Win32_System_Console",
  "Win32_System_Diagnostics_ToolHelp",
  "Win32_System_JobObjects",
  "Win32_System_Threading",
  "Win32_UI_Shell",
] }
windows-native-keyring-store = { version = "1.1", optional = true }

[target.'cfg(target_os = "linux")'.dependencies]
# Without a crypto feature secret-service does not compile; crypto-rust is
# what zbus-secret-service-keyring-store enables through keyring.
secret-service = { version = "5.2", optional = true, default-features = false, features = ["crypto-rust"] }

# Scripted stand-in for 7zz/unrar/bsdtar in the external-tool tests
# (plan AP-5); never shipped.
[[bin]]
name = "coverly-fake-tool"
path = "src/bin/coverly-fake-tool.rs"
required-features = ["test-util"]
test = false
doctest = false

[features]
# Mock HTTP server, fixtures and throwaway update keys for tests of this
# crate and of the CLI.
test-util = ["dep:minisign", "sevenz-rust2/compress"]
# The OS keychain store and the per-platform crates its errors are
# classified by (same versions keyring pulls in).
keychain = [
  "dep:keyring",
  "dep:security-framework",
  "dep:windows-native-keyring-store",
  "dep:secret-service",
]

[dev-dependencies]
coverly-core = { path = ".", features = ["test-util"] }
filetime.workspace = true
insta.workspace = true
tempfile.workspace = true
# Encoders for synthetic archive fixtures (tests only).
sevenz-rust2 = { workspace = true, features = ["bzip2", "deflate", "ppmd", "compress"] }
lzma-rust2 = { workspace = true, features = ["encoder"] }
ruzstd = { workspace = true, features = ["std"] }
lz4_flex = { workspace = true, features = ["safe-encode"] }
bzip2.workspace = true
