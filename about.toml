# cargo-about configuration for the Rust third-party notices
# (`pnpm notices` → LICENSES/generated/rust.txt, spec D28). Runs on a
# developer machine only (cargo-about 0.9.2); CI and release check the
# committed file with `pnpm notices:check` instead.

# Every release target, so platform-only crates are listed too.
targets = [
    "aarch64-apple-darwin",
    "x86_64-apple-darwin",
    "x86_64-pc-windows-msvc",
    "aarch64-pc-windows-msvc",
    "x86_64-unknown-linux-gnu",
    "aarch64-unknown-linux-gnu",
]
ignore-build-dependencies = true
ignore-dev-dependencies = true

# Same allowlist as scripts/check-licenses.sh (which is the gate; this only
# has to accept what that script already allows).
accepted = [
    "MIT",
    "MIT-0",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Zlib",
    "CC0-1.0",
    "Unicode-3.0",
    "BSL-1.0",
    "bzip2-1.0.6",
    "CDLA-Permissive-2.0",
    "MPL-2.0",
    "OpenSSL",
]

# This workspace's own crates: accepted here so generation succeeds, then
# dropped from the output by scripts/licenses/notices.mjs (they are Coverly
# itself, whose licence is LICENSE at the repository root).
[coverly-core]
accepted = ["AGPL-3.0-only"]

[coverly-cli]
accepted = ["AGPL-3.0-only"]

[coverly-roms]
accepted = ["AGPL-3.0-only"]
