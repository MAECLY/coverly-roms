<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024">
<title>Coverly ROMs maskable icon (full bleed)</title>
<!-- Full-bleed Buckram square, no corner radius: the platform applies its own mask.
     Every glyph pixel stays inside the 40% safe-zone circle (r = 409.6 around 512,512);
     the farthest point, the cover's lower-left corner, sits at about r = 367. -->
<rect id="tile" width="1024" height="1024" fill="#0E5E6F"/>
<g id="glyph" transform="matrix(.88 0 0 .88 61.44 61.44)"><g transform="translate(0 -22)">
<rect x="165.8" y="311.9" width="300" height="400" rx="48" fill="#FBFBF9" transform="rotate(12 465.8 711.9)"/><rect x="568" y="327" width="246" height="348" rx="22" fill="none" stroke="#FBFBF9" stroke-width="56"/><rect x="172" y="737" width="680" height="56" rx="28" fill="#E6C171"/>
</g></g>
</svg>
