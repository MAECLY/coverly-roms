<!DOCTYPE html>
<!-- The Open Graph card, rendered from the landing's own CSS and screenshots.
     Serve the filled site with this file copied into it (make site-og does
     it), open og.html?lang=es or ?lang=en at a 1200x630 viewport, device
     pixel ratio 1, light colour scheme, and save a screenshot as
     site/assets/og.png or og-en.png. Not published. -->
<html lang="es">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="assets/site.css">
<style>
  html, body { margin: 0; width: 1200px; height: 630px; overflow: hidden; }
  .og { position: relative; width: 1200px; height: 630px; display: grid; grid-template-columns: 520px 1fr; background: var(--cr-bg); }
  .og-copy { padding: 64px 0 56px 64px; display: flex; flex-direction: column; justify-content: space-between; }
  .og h1 { font-size: 92px; line-height: 0.95; }
  .og p { font-size: 24px; color: var(--cr-text-muted); margin-top: 22px; line-height: 1.35; }
  .og .wordmark { font-size: 34px; }
  .og-shot { position: relative; overflow: hidden; }
  .og-shot img { position: absolute; left: 40px; top: 64px; width: 980px; height: auto; border-radius: 14px; border: 1px solid var(--cr-border); box-shadow: 0 30px 60px -20px rgb(28 27 26 / 35%); }
</style>
</head>
<body>
<div class="og">
  <div class="og-copy">
    <div>
      <h1 id="h"></h1>
      <p id="p"></p>
    </div>
    <span class="wordmark">Coverly<b>ROMs</b></span>
  </div>
  <div class="og-shot"><img id="img" alt=""></div>
</div>
<script>
  var en = /lang=en/.test(location.search);
  document.documentElement.lang = en ? "en" : "es";
  document.getElementById("h").textContent = en ? "Every ROM gets its cover." : "Cada ROM, con su portada.";
  document.getElementById("p").textContent = en
    ? "See which games on your SD card have no cover art and fill them in one go. Dry run first, undo after."
    : "Mira qué juegos de tu tarjeta SD no tienen portada y añádelas de una vez. Primero la simulación, después deshacer.";
  document.getElementById("img").src = "assets/shots/" + (en ? "en" : "es") + "/library-light.webp";
</script>
</body>
</html>
