# Builds a signed Coverly ROMs release into a DRAFT on GitHub Releases.
#
# Push a tag `vX.Y.Z` (stable) or `vX.Y.Z-beta.N` (beta). See RELEASING.md.
# Nothing is published: a person checks the draft and publishes it, because
# the updater offers a version the moment it is public. Publishing runs
# release-channels.yml, which moves the beta channel's manifest.
#
# Who holds what (least privilege, ADR-0011):
# - guard and draft run no third-party build code. draft (contents: write)
#   only runs `gh` to create or reuse the draft.
# - app and cli compile third-party code (crates and their build scripts, npm
#   packages, the Tauri CLI), so they hold `contents: read` only: they cannot
#   push, tag or touch the draft. They never see the signing secret either:
#   `tauri build` needs a key for createUpdaterArtifacts, so each app build
#   signs with a throwaway key generated on the spot. They hand their files
#   to finalize as workflow artifacts (actions/upload-artifact).
# - finalize builds nothing. It downloads those artifacts, signs every update
#   artifact and CLI binary with the real key (bound to the version,
#   --app-version), writes latest.json itself (release_tools.py
#   updater-manifest + add-cli), verifies every signature with minisign
#   against crates/coverly-core/updater.pub (and that a tampered copy fails),
#   writes SHA256SUMS and uploads everything to the draft. It is the only job
#   besides draft with contents: write. It signs what the read-only builds
#   produced; it cannot tell whether a build was compromised while it
#   compiled (ADR-0011).
#
# No OS certificates (ADR-0008): macOS is signed ad hoc (signingIdentity "-"),
# Windows installers are not Authenticode-signed; the notes explain both.
name: release

on:
  push:
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+'
      - 'v[0-9]+.[0-9]+.[0-9]+-*'

permissions: {}

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  REPO: ${{ github.repository }}

jobs:
  guard:
    name: Guard (secret, public repo, versions, key, changelog)
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Signing key must be configured
        env:
          # Only whether it is set: this step never sees the key itself.
          SIGNING_KEY_SET: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY != '' }}
        run: |
          if [ "$SIGNING_KEY_SET" != true ]; then
            echo "::error::TAURI_SIGNING_PRIVATE_KEY is not set. See RELEASING.md section 2."
            exit 1
          fi
      - name: The repository must be public (the updater downloads anonymously)
        env:
          PRIVATE: ${{ github.event.repository.private }}
        run: |
          if [ "$PRIVATE" = "true" ]; then
            echo "::error::the repository is private; make it public first (RELEASING.md section 3)"
            exit 1
          fi
      - name: The updater key must be committed
        run: python3 -I scripts/release/release_tools.py pubkey --file crates/coverly-core/updater.pub > /dev/null
      - name: Tag, versions and CHANGELOG agree
        run: |
          set -euo pipefail
          scripts/bump-version.sh --check
          tag="${GITHUB_REF_NAME#v}"
          crate=$(scripts/bump-version.sh --check | awk '$1=="Cargo.toml"{print $2}')
          if [ "$tag" != "$crate" ]; then
            echo "::error::tag $tag does not match Cargo.toml $crate; run scripts/bump-version.sh"
            exit 1
          fi
          grep -q "^## \[$tag\]" CHANGELOG.md || { echo "::error::CHANGELOG.md has no ## [$tag] section"; exit 1; }

  draft:
    name: Create the draft
    needs: [guard]
    runs-on: ubuntu-latest
    permissions:
      contents: write # creates the draft; runs only gh, no build code
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Create or reuse the draft
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          version="${GITHUB_REF_NAME#v}"
          sed -e "s/<version>/$version/g" -e "s/<versión>/$version/g" .github/release-notes.md > notes.md
          id=$(gh api --paginate "repos/$REPO/releases" --jq ".[] | select(.tag_name == \"$GITHUB_REF_NAME\") | .id" | head -n1)
          if [ -n "$id" ]; then
            draft=$(gh api "repos/$REPO/releases/$id" --jq .draft)
            [ "$draft" = true ] || { echo "::error::$GITHUB_REF_NAME is already published"; exit 1; }
          else
            prerelease=()
            if [[ "$GITHUB_REF_NAME" == *-* ]]; then prerelease=(--prerelease); fi
            gh release create "$GITHUB_REF_NAME" --repo "$REPO" --draft --verify-tag \
              --title "Coverly ROMs $GITHUB_REF_NAME" --notes-file notes.md "${prerelease[@]}"
          fi

  app:
    name: App (${{ matrix.name }})
    needs: [guard]
    permissions:
      contents: read # builds third-party code: no write access, no secret
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: macOS universal
            slug: macos-universal
            platform: macos-latest
            targets: aarch64-apple-darwin x86_64-apple-darwin
            args: '--target universal-apple-darwin'
          - name: Windows x64
            slug: windows-x86_64
            platform: windows-latest
            targets: x86_64-pc-windows-msvc
            args: ''
          - name: Linux x64
            slug: linux-x86_64
            platform: ubuntu-22.04
            targets: x86_64-unknown-linux-gnu
            args: ''
          - name: Linux ARM64
            slug: linux-aarch64
            platform: ubuntu-22.04-arm
            targets: aarch64-unknown-linux-gnu
            args: ''
    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v4.4.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          package-manager-cache: false
      - name: Linux system dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf \
            build-essential libssl-dev libxdo-dev
      - name: Rust toolchain
        shell: bash
        env:
          TARGETS: ${{ matrix.targets }}
        run: |
          set -euo pipefail
          rustup toolchain install stable --profile minimal
          rustup default stable
          for t in $TARGETS; do rustup target add "$t"; done
      - name: Install frontend dependencies
        run: pnpm install --frozen-lockfile --ignore-scripts
      - name: Throwaway updater key (the real one never reaches a build)
        shell: bash
        run: |
          set -euo pipefail
          key="$RUNNER_TEMP/throwaway.key"
          pass=$(openssl rand -hex 24)
          echo "::add-mask::$pass"
          pnpm tauri signer generate --ci --force -p "$pass" -w "$key"
          # `tauri build` base64-decodes plugins.updater.pubkey, and the
          # committed value is only a marker (the app reads
          # crates/coverly-core/updater.pub at runtime), so the build gets the
          # throwaway public key through a config overlay.
          printf '{"plugins":{"updater":{"pubkey":"%s"}}}\n' "$(tr -d '\r\n' < "$key.pub")" \
            > "$RUNNER_TEMP/updater-overlay.json"
          {
            echo "TAURI_SIGNING_PRIVATE_KEY<<KEY_EOF"
            cat "$key"
            echo
            echo "KEY_EOF"
            echo "TAURI_SIGNING_PRIVATE_KEY_PASSWORD=$pass"
          } >> "$GITHUB_ENV"
          rm -f "$key" "$key.pub"
      - name: Build the bundles (build only; this job cannot upload to the release)
        shell: bash
        env:
          ARGS: ${{ matrix.args }}
        run: |
          set -euo pipefail
          bundles=""
          # WiX (the .msi) accepts only a numeric prerelease, so a prerelease
          # tag such as v1.0.0-beta.1 builds the NSIS installer alone on
          # Windows (RELEASING.md section 6).
          if [ "$RUNNER_OS" = Windows ] && [[ "$GITHUB_REF_NAME" == *-* ]]; then
            bundles="--bundles nsis"
          fi
          # shellcheck disable=SC2086 # ARGS and bundles hold zero or more flags
          pnpm tauri build $ARGS $bundles --config "$RUNNER_TEMP/updater-overlay.json"
      - name: Stage the bundles under their release names
        shell: bash
        run: |
          set -euo pipefail
          shopt -s nullglob
          version="${GITHUB_REF_NAME#v}"
          mkdir -p staged
          for f in target/release/bundle/*/* target/*/release/bundle/*/*; do
            [ -f "$f" ] || continue
            base=$(basename "$f")
            case "$base" in
              # The macOS update archive carries no version or architecture;
              # the only macOS build is universal.
              *.app.tar.gz) name="${base%.app.tar.gz}_${version}_universal.app.tar.gz" ;;
              *.dmg | *-setup.exe | *.msi | *.AppImage | *.deb) name="$base" ;;
              # The throwaway .sig files stay here: finalize signs again.
              *) continue ;;
            esac
            # Name each file as GitHub would store it (no spaces).
            name=$(printf '%s' "$name" | tr -c 'A-Za-z0-9._-' '.')
            cp "$f" "staged/$name"
          done
          ls -l staged
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: app-${{ matrix.slug }}
          path: staged/
          if-no-files-found: error
          retention-days: 7

  cli:
    name: CLI (${{ matrix.os }}-${{ matrix.arch }})
    needs: [guard]
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - {
              platform: macos-latest,
              target: aarch64-apple-darwin,
              os: darwin,
              arch: aarch64,
            }
          - {
              platform: macos-latest,
              target: x86_64-apple-darwin,
              os: darwin,
              arch: x86_64,
            }
          - {
              platform: windows-latest,
              target: x86_64-pc-windows-msvc,
              os: windows,
              arch: x86_64,
            }
          - {
              platform: ubuntu-22.04,
              target: x86_64-unknown-linux-gnu,
              os: linux,
              arch: x86_64,
            }
          - {
              platform: ubuntu-22.04-arm,
              target: aarch64-unknown-linux-gnu,
              os: linux,
              arch: aarch64,
            }
    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Rust toolchain
        shell: bash
        env:
          TARGET: ${{ matrix.target }}
        run: |
          set -euo pipefail
          rustup toolchain install stable --profile minimal
          rustup default stable
          rustup target add "$TARGET"
      - name: Build coverly
        shell: bash
        env:
          TARGET: ${{ matrix.target }}
          OS: ${{ matrix.os }}
          ARCH: ${{ matrix.arch }}
        run: |
          set -euo pipefail
          cargo build --release --locked -p coverly-cli --target "$TARGET"
          version="${GITHUB_REF_NAME#v}"
          ext=""; [ "$OS" = windows ] && ext=".exe"
          mkdir -p staged
          cp "target/$TARGET/release/coverly$ext" "staged/coverly-$version-$OS-$ARCH$ext"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: cli-${{ matrix.os }}-${{ matrix.arch }}
          path: staged/
          if-no-files-found: error
          retention-days: 7

  finalize:
    name: Sign, manifest, verify, checksums, upload
    needs: [draft, app, cli]
    runs-on: ubuntu-latest
    permissions:
      contents: write # uploads to the draft; compiles nothing
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v4.4.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          package-manager-cache: false
      - name: Install the tauri CLI (no install scripts)
        run: pnpm install --frozen-lockfile --ignore-scripts
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: app-*
          path: bundles
          merge-multiple: true
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: cli-*
          path: cli
          merge-multiple: true
      - name: List the update artifacts
        run: |
          set -euo pipefail
          shopt -s nullglob
          sigs=(bundles/*.sig cli/*.sig)
          if [ ${#sigs[@]} -gt 0 ]; then
            echo "::error::a build handed over signature files: ${sigs[*]}"; exit 1
          fi
          python3 -I scripts/release/release_tools.py updater-artifacts --dir bundles > artifacts.txt
          cat artifacts.txt
      - name: Sign with the release key (the only step that sees it)
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          version="${GITHUB_REF_NAME#v}"
          mapfile -t artifacts < artifacts.txt
          for name in "${artifacts[@]}"; do
            pnpm --silent tauri signer sign --app-version "$version" "bundles/$name"
          done
          for f in cli/*; do
            pnpm --silent tauri signer sign --app-version "$version" "$f"
          done
      - name: Write latest.json (app and CLI entries, real signatures)
        run: |
          set -euo pipefail
          version="${GITHUB_REF_NAME#v}"
          base="https://github.com/$REPO/releases/download/$GITHUB_REF_NAME"
          python3 -I scripts/release/release_tools.py updater-manifest --dir bundles \
            --version "$version" --base-url "$base" --changelog CHANGELOG.md --output latest.json
          python3 -I scripts/release/release_tools.py add-cli --manifest latest.json --dir cli \
            --version "$version" --base-url "$base"
          python3 -I scripts/release/release_tools.py check-manifest --manifest latest.json \
            --version "$version" --signed-version "$version" \
            --require darwin-aarch64 --require darwin-x86_64 --require windows-x86_64 \
            --require linux-x86_64 --require linux-aarch64 \
            --require cli-darwin-aarch64 --require cli-darwin-x86_64 --require cli-windows-x86_64 \
            --require cli-linux-x86_64 --require cli-linux-aarch64
          cat latest.json
      - name: Verify every signature against the committed key (and a tampered copy fails)
        run: |
          set -euo pipefail
          shopt -s nullglob
          sudo apt-get update -qq && sudo apt-get install -y -qq minisign
          python3 -I scripts/release/release_tools.py pubkey --file crates/coverly-core/updater.pub | base64 -d > updater.pub
          mapfile -t artifacts < artifacts.txt
          signed=()
          for name in "${artifacts[@]}"; do signed+=("bundles/$name"); done
          signed+=(cli/*)
          first=""
          for f in "${signed[@]}"; do
            case "$f" in *.sig) continue ;; esac
            test -f "$f.sig" || { echo "::error::$f has no signature"; exit 1; }
            base64 -d "$f.sig" > "$f.minisig"
            minisign -V -p updater.pub -m "$f" -x "$f.minisig"
            case "$f" in cli/*) [ -n "$first" ] || first="$f" ;; esac
          done
          test -n "$first" || { echo "::error::no CLI binary to tamper with"; exit 1; }
          # Appending always changes the content (overwriting a byte might
          # write the value already there).
          cp "$first" tampered
          printf 'tampered' >> tampered
          if minisign -V -p updater.pub -m tampered -x "$first.minisig"; then
            echo "::error::a tampered artifact verified"; exit 1
          fi
          rm -f bundles/*.minisig cli/*.minisig tampered
      - name: SHA256SUMS and upload to the draft
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          mkdir -p all
          # Every downloadable file (the .dmg, .msi and .deb included), not
          # only the update artifacts.
          cp bundles/* cli/* all/
          rm -f all/*.sig
          (cd all && sha256sum -- * > ../SHA256SUMS)
          kinds=('\.dmg' '\.app\.tar\.gz' '-setup\.exe' '\.AppImage' '\.deb')
          # A prerelease has no .msi (WiX refuses a non-numeric prerelease).
          [[ "$GITHUB_REF_NAME" == *-* ]] || kinds+=('\.msi')
          for kind in "${kinds[@]}"; do
            grep -q -e "$kind\$" SHA256SUMS || { echo "::error::SHA256SUMS has no $kind file"; exit 1; }
          done
          gh release upload "$GITHUB_REF_NAME" bundles/* cli/* latest.json SHA256SUMS --repo "$REPO" --clobber
          {
            echo "### Coverly ROMs $GITHUB_REF_NAME is waiting as a draft"
            echo "Check it (RELEASING.md section 5) before publishing; publishing moves the beta channel."
            echo '```'; cat SHA256SUMS; echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
