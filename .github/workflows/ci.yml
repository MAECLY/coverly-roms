# The checks a pull request must pass: lint, typecheck, format, tests and a
# production build for the frontend, and fmt, clippy and tests for the whole
# Rust workspace (coverly-core, coverly-cli, src-tauri) on Linux, Windows and
# macOS. Nothing here builds an installer or reads a secret.
# See docs/07-build-and-release/ci-cd.md.
name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

# Every job only reads the repository; none publishes anything.
permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  frontend:
    name: Frontend (lint + typecheck + format + test + build)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # Reads the pnpm version from package.json `packageManager`.
      - uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v4.4.0

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile --ignore-scripts

      # design/tokens.json is the source of truth: the generated CSS must
      # match it and every contrast pair must meet its WCAG target.
      - name: Design tokens
        run: pnpm tokens:check

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      - name: Format check
        run: pnpm format:check

      - name: Test
        run: pnpm test

      - name: Build
        run: pnpm build

  # coverly-core and coverly-cli touch the filesystem (paths, case, hidden
  # files) and ship on all three desktop platforms, so the whole workspace
  # is checked on each of them.
  backend:
    name: Backend (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # Tauri 2 on Linux links against WebKitGTK 4.1 and friends.
      - name: Install Linux system dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf \
            build-essential libssl-dev libxdo-dev

      # rustup is on every hosted runner, so the toolchain needs no action.
      - name: Install Rust toolchain
        shell: bash
        run: |
          set -euo pipefail
          rustup toolchain install stable --profile minimal --component rustfmt,clippy
          rustup default stable
          rustc --version

      - name: Cache cargo
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            target/
          key: ${{ runner.os }}-cargo-${{ hashFiles('Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-

      # `tauri::generate_context!` in src-tauri requires `frontendDist`
      # (../dist) to exist at compile time. The Rust checks do not need the
      # real frontend bundle, so an empty directory is enough.
      - name: Create placeholder frontend dist
        shell: bash
        run: mkdir -p dist

      # Formatting does not depend on the platform: once is enough.
      - name: cargo fmt
        if: runner.os == 'Linux'
        run: cargo fmt --all -- --check

      - name: cargo clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: cargo test
        run: cargo test --workspace
