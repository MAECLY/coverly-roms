name: Pages

# Publishes the static landing page in site/ to GitHub Pages
# (https://coverly-roms.maecly.com, see site/CNAME). site/ names no version,
# date, download link or file size: scripts/site/apply_release.py fills its
# {{release.*}} markers from the latest published release, so publishing a
# release redeploys the landing with that release's files. Before the first
# release the API answers 404 and the page ships its "not published yet"
# state instead (--no-release); any other API error fails the deploy.
#
# The github-pages environment only deploys from main, and a release event
# runs on the tag (an older commit, refused by that rule). So on a release the
# `redeploy` job only asks for a fresh run of this workflow on main
# (workflow_dispatch from GITHUB_TOKEN does start workflows), and that run
# deploys. A release published with GITHUB_TOKEN would not trigger this at
# all; ours are published by a person, and Run workflow redeploys by hand.
#
# Pages on the Free plan only publishes from a public repository. See
# docs/07-build-and-release/landing.md for the one-time setup (Pages source,
# custom domain, DNS).
on:
  push:
    branches: [main]
    paths:
      - 'site/**'
      - 'scripts/site/**'
      - '.github/workflows/pages.yml'
  release:
    types: [published]
  workflow_dispatch:

# Nothing by default; each job asks for what it needs.
permissions: {}

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  redeploy:
    name: Redeploy from main for the new release
    if: github.event_name == 'release'
    runs-on: ubuntu-latest
    permissions:
      actions: write # starts this workflow on main
    steps:
      - name: Run Pages on the default branch
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: gh workflow run pages.yml --repo "$REPO" --ref "$DEFAULT_BRANCH"

  deploy:
    name: Deploy site/
    if: github.event_name != 'release'
    runs-on: ubuntu-latest
    permissions:
      contents: read # checks out site/ and reads the latest release
      pages: write # deploys to GitHub Pages
      id-token: write # proves the deployment's origin to Pages
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0

      # The checks that need no browser: links, ES/EN parity, FAQ JSON-LD,
      # head tags, size budgets and token contrast, on both page states.
      - name: Check the landing
        run: python3 -I scripts/site/check_site.py

      # The latest published release (drafts and pre-releases are never
      # "latest"). The script fails, and nothing is deployed, when any
      # download or SHA256SUMS is missing, so the landing never links a file
      # that is not there. Only a 404 (no release yet) selects --no-release.
      - name: Fill in the latest release
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          if gh api "repos/$REPO/releases/latest" > "$RUNNER_TEMP/release.json" 2> "$RUNNER_TEMP/release.err"; then
            python3 -I scripts/site/apply_release.py \
              --release-json "$RUNNER_TEMP/release.json" \
              --repo "$REPO" \
              --site site \
              --out "$RUNNER_TEMP/site"
          elif grep -q "HTTP 404" "$RUNNER_TEMP/release.err"; then
            echo "No published release yet: deploying the not-published-yet state."
            python3 -I scripts/site/apply_release.py \
              --no-release \
              --repo "$REPO" \
              --site site \
              --out "$RUNNER_TEMP/site"
          else
            cat "$RUNNER_TEMP/release.err" >&2
            exit 1
          fi

      # Since v4 dotfiles stay out of the artifact. The only one in site/ is
      # .nojekyll, which a Pages deployment from Actions does not need: Jekyll
      # only runs for a branch-based Pages build.
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: ${{ runner.temp }}/site

      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
