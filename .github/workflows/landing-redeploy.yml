name: Landing redeploy

# The landing (site/) is built and served by Vercel (project
# coverly-roms-landing, see vercel.json and scripts/site/vercel_build.sh),
# which deploys main on every push. site/ names no version: the build fills
# its {{release.*}} markers from the latest published release. So publishing
# a release changes no file, and this workflow asks Vercel for a fresh
# production build of main through a deploy hook. A release published with
# GITHUB_TOKEN would not trigger this; ours are published by a person, and
# Run workflow redeploys by hand.
#
# VERCEL_DEPLOY_HOOK_URL is a repository secret holding the hook URL
# (Vercel → Project → Settings → Git → Deploy Hooks, branch main). See
# docs/07-build-and-release/landing.md.
on:
  release:
    types: [published]
  workflow_dispatch:

# The hook URL is the only credential; no GITHUB_TOKEN scope is needed.
permissions: {}

concurrency:
  group: landing-redeploy
  cancel-in-progress: false

jobs:
  redeploy:
    name: Redeploy the landing on Vercel
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Call the Vercel deploy hook
        env:
          HOOK: ${{ secrets.VERCEL_DEPLOY_HOOK_URL }}
        run: |
          set -euo pipefail
          if [ -z "${HOOK:-}" ]; then
            echo "::error::The VERCEL_DEPLOY_HOOK_URL secret is empty or missing; set it to the coverly-roms-landing deploy hook for main." >&2
            exit 1
          fi
          curl -fsS -X POST "$HOOK" > /dev/null
          echo "Vercel accepted the deploy hook: a production build of main is queued."
