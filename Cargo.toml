[workspace]
resolver = "2"
members = ["crates/coverly-core", "crates/coverly-cli", "src-tauri"]

[workspace.package]
version = "0.1.0"
edition = "2021"
rust-version = "1.93"
license = "AGPL-3.0-only"
repository = "https://github.com/MAECLY/coverly-roms"
authors = ["Maecly maintainers"]

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "1"
thiserror = "2"
anyhow = "1"
walkdir = "2"
unicode-normalization = "0.1"
clap = { version = "4", features = ["derive"] }
tempfile = "3"
assert_cmd = "2"
predicates = "3"
insta = { version = "1", features = ["json"] }
filetime = "0.2"
crc32fast = "1.5"
md-5 = "0.10"
sha1 = "0.10"
# Only deflate/deflate64/bzip2 are ever enabled (crates/coverly-core): LZMA,
# XZ, PPMd and zstd entries are read raw and decoded by `archive` with capped
# decoders (spec S2, S3). Guarded by scripts/check-zip-features.sh.
zip = { version = "9", default-features = false }
sevenz-rust2 = { version = "=0.23.0", default-features = false }
lzma-rust2 = { version = "=0.21.0", default-features = false, features = ["std", "optimization", "xz"] }
ppmd-rust = "=1.5.0"
ruzstd = { version = "=0.9.0", default-features = false, features = ["std"] }
lz4_flex = { version = "=0.14.0", default-features = false, features = ["std", "safe-decode", "checked-decode", "frame"] }
tar = { version = "=0.4.46", default-features = false }
# Default features select the pure-Rust libbz2-rs-sys backend.
bzip2 = "=0.6.1"
rusqlite = { version = "0.40", features = ["bundled"] }
directories = "6"
ureq = "3.4"
flate2 = "1"
percent-encoding = "2.3"
quick-xml = "0.38"
keyring = "4"
log = "0.4"
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "webp", "gif", "bmp"] }
semver = "1"
base64 = "0.22"
minisign-verify = "0.3"
minisign = "0.9"
libc = "0.2"
windows-sys = "0.61"
objc2-foundation = { version = "0.3", default-features = false, features = ["std", "NSError", "NSFileManager", "NSString", "NSURL"] }
